[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "state-constrained"
version = "0.1.0"
description = "Physics-informed policy iteration for deterministic state-constrained optimal control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.23",
  "torch>=1.12",
  "matplotlib>=3.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
aligned = ["scipy>=1.10", "torch>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
